name: Build CodeMaster AI Offline APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get llama.cpp engine
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android native build tools
        run: sdkmanager "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build offline APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CodeMaster-AI-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
